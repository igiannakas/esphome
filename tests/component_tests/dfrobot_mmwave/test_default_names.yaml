    dfrobot_mmwave_id: c4001
    target_count: {}
    target_1_distance: {}
    target_1_speed: {}
    target_1_energy: {}
  - platform: dfrobot_mmwave
    dfrobot_mmwave_id: sen0395
    target_1_snr: {}
    target_8_distance: {}
    target_8_snr: {}

text_sensor:
